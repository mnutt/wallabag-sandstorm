name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Debian 12 build and regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build CI environment
        run: >-
          docker build --pull -f ci/Dockerfile
          --build-arg CI_UID="$(id -u)" --build-arg CI_GID="$(id -g)"
          -t wallabag-ci .
      - name: Build application and run checks
        run: docker run --rm --init -v "$GITHUB_WORKSPACE:/opt/app" wallabag-ci
