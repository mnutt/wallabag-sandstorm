# Private to this grain; no network listener or eviction of queued imports.
port 0
unixsocket /var/run/wallabag-redis.sock
unixsocketperm 700
dir /var/lib/wallabag/redis
daemonize no
loglevel warning
maxclients 64
save ""
appendonly yes
appendfsync always
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 16mb
maxmemory-policy noeviction
