worker_processes 1;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log;
events { worker_connections 128; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    # Sandstorm transports attachment disposition when a filename is supplied.
    # SVGs still display in <img>, but navigation downloads them rather than
    # opening an active SVG document on the library's origin.
    map $sent_http_content_type $svg_disposition {
        default "";
        ~*^image/svg\+xml "attachment; filename=\"image.svg\"";
    }
    client_body_temp_path /var/lib/nginx/body;
    fastcgi_temp_path /var/lib/nginx/fastcgi;
    proxy_temp_path /var/lib/nginx/proxy;
    # The bridge is our only ingress and supplies X-Forwarded-Proto itself.
    # Give PHP the external scheme consistently: Symfony's inline fragment
    # renderer temporarily trusts loopback proxies, which otherwise makes the
    # CSRF manager see HTTPS during form rendering but HTTP during submission.
    map $http_x_forwarded_proto $sandstorm_https {
        default off;
        https on;
    }
    map $http_x_sandstorm_permissions $library_access {
        default 0;
        ~(^|,\s*)access(\s*,|$) 1;
    }
    map $http_x_sandstorm_permissions $feed_access {
        default 0;
        ~(^|,\s*)feeds(\s*,|$) 1;
    }
    map "$request_method:$uri" $feed_request {
        default 0;
        ~^(GET|HEAD):/feeds/(all|unread|archive|starred)\.xml$ 1;
    }
    map "$library_access:$feed_access:$feed_request" $request_allowed {
        default 0;
        ~^1: 1;
        "0:1:1" 1;
    }
    server {
        listen 8000;
        server_name _;
        root /opt/app/build/wallabag/web;
        index app.php;
        client_max_body_size 100m;
        if ($request_allowed = 0) { return 403; }
        location = /_sandstorm/websocket {
            proxy_pass http://127.0.0.1:3001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_read_timeout 3600s;
        }
        # Never expose raw import uploads, including older package layouts.
        location = /uploads/import { return 404; }
        location ^~ /uploads/import/ { return 404; }

        location / {
            add_header Content-Disposition $svg_disposition;
            # The bridge forwards Accept-Encoding and Content-Encoding. Compress
            # static text assets (material.js alone is over 3 MB). Keep this out
            # of the PHP location: HTML contains session-specific CSRF tokens.
            gzip on;
            gzip_comp_level 5;
            gzip_min_length 1024;
            gzip_types application/javascript text/css application/json image/svg+xml;
            # ETags remain enabled for revalidation. Ordinary Cache-Control and
            # Expires headers are not forwarded by sandstorm-http-bridge, so do
            # not imply that adding max-age here would provide browser caching.
            try_files $uri /app.php$is_args$args;
        }
        location = /app.php {
            internal;
            include /etc/nginx/fastcgi_params;
            fastcgi_param HTTPS $sandstorm_https;
            fastcgi_param SCRIPT_FILENAME /opt/app/build/wallabag/web/app.php;
            fastcgi_param HTTP_PROXY "";
            fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
            fastcgi_read_timeout 300s;
            # Includes the FPM queue and PHP work until response headers arrive.
            # Sandstorm allows this prefix; standard Server-Timing is filtered.
            add_header X-Sandstorm-App-Upstream-Header-Seconds $upstream_header_time always;
        }
        location ~ \.php$ { return 404; }
        location ~ /\. { deny all; }
    }
}
