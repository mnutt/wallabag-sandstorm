worker_processes 1;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log;
events { worker_connections 128; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    client_body_temp_path /var/lib/nginx/body;
    fastcgi_temp_path /var/lib/nginx/fastcgi;
    proxy_temp_path /var/lib/nginx/proxy;
    map $http_x_sandstorm_permissions $library_access {
        default 0;
        ~(^|,\s*)access(\s*,|$) 1;
    }
    map $http_x_sandstorm_permissions $feed_access {
        default 0;
        ~(^|,\s*)feeds(\s*,|$) 1;
    }
    map "$request_method:$uri" $feed_request {
        default 0;
        ~^(GET|HEAD):/feeds/(all|unread|archive|starred)\.xml$ 1;
    }
    map "$library_access:$feed_access:$feed_request" $request_allowed {
        default 0;
        ~^1: 1;
        "0:1:1" 1;
    }
    server {
        listen 8000;
        server_name _;
        root /opt/app/build/wallabag/web;
        index app.php;
        client_max_body_size 100m;
        if ($request_allowed = 0) { return 403; }
        location = /_sandstorm/websocket {
            proxy_pass http://127.0.0.1:3001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_read_timeout 3600s;
        }
        location / { try_files $uri /app.php$is_args$args; }
        location = /app.php {
            internal;
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /opt/app/build/wallabag/web/app.php;
            fastcgi_param HTTP_PROXY "";
            fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
            fastcgi_read_timeout 300s;
        }
        location ~ \.php$ { return 404; }
        location ~ /\. { deny all; }
    }
}
